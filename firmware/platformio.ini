; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -D USB_MIDI16_AUDIO_SERIAL
    ; Overrides MIDI_NUM_CABLES (16 -> 2) without patching the framework package,
    ; see include/usb_desc_override.h
    -include "${platformio.include_dir}/usb_desc_override.h" 
; no USB speaker: the minichord sends its sound to the host for recording but takes none back, so a
; phone or computer keeps its own sound when the minichord is plugged in (tools/usb_no_speaker.py)
extra_scripts = pre:tools/usb_no_speaker.py
