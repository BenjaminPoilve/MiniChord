; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -D USB_MIDI16_AUDIO_SERIAL
    ; Overrides MIDI_NUM_CABLES (16 -> 2) without patching the framework package,
    ; see include/usb_desc_override.h
    -include "${platformio.include_dir}/usb_desc_override.h" 
; USB audio, a choice (address 244): the host offered a USB speaker or not, decided before USB starts
; (tools/usb_audio_choice.py builds the core's usb_desc.c and usb.c with both arrangements)
extra_scripts = pre:tools/usb_audio_choice.py
