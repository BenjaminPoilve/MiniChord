name: Firmware build

# Builds the firmware for the Teensy on every push and pull request that touches
# it, so a change that does not compile is visible on the pull request itself
# rather than needing a reviewer to check out the branch and build it by hand.
#
# Build only: this does not run tests, because there are none yet. The testing
# work in #85 is the natural next step and would slot in here as a second job.

on:
  push:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-build.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for Teensy 4.0
    runs-on: ubuntu-latest
    # Skip only the runs this workflow's own auto-commits would trigger on
    # themselves — not a blanket [skip ci], which would also stop unrelated
    # workflows (e.g. the Pages deploy) from running on the same push.
    if: |
      !startsWith(github.event.head_commit.message, 'Regenerate firmware sources from parameters.json') &&
      !startsWith(github.event.head_commit.message, 'Update built firmware.hex')

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # The actual branch tip, not the ephemeral PR merge ref, so a
          # generated-files commit below can be pushed straight to it.
          # A pull request from a fork has its branch in the fork, not here, so
          # the branch name has to be resolved against the head repository or
          # the checkout fails with "a branch or tag ... could not be found".
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref }}
          # Full history so we can diff against the previous commit / PR base
          # to tell whether generator/parameters.json changed.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check whether the generator parameters changed
        id: params
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi
          if [ -z "$base_sha" ] || ! git cat-file -e "$base_sha" 2>/dev/null; then
            # No usable base commit (e.g. workflow_dispatch, or a brand new
            # branch) — regenerate to be safe.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base_sha" -- firmware/generator/parameters.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # generate.py turns parameters.json into firmware/include/sysex_handler.h
      # and firmware/minicontrol/index.html (which the build below compiles
      # against), and copies parameters.json itself to
      # firmware/minicontrol/json/. Running it here means nobody has to run
      # generate.sh by hand after editing parameters.json.
      - name: Regenerate firmware sources from parameters.json
        if: steps.params.outputs.changed == 'true'
        working-directory: firmware/generator
        run: |
          pip install -r requirements.txt
          python3 generate.py

      # Puts the repo back in the state generate.sh would have left it in
      # locally, so nobody has to remember to run it before pushing. The job
      # `if:` above stops this specific commit from re-triggering this job.
      - name: Commit regenerated firmware sources
        # A pull request from a fork gets a read only token and its branch
        # lives in the fork, so nothing can be pushed there. Skip the commit
        # and let the build result stand on its own.
        if: steps.params.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Regenerate firmware sources from parameters.json"
          file_pattern: 'firmware/include/sysex_handler.h firmware/minicontrol/index.html firmware/minicontrol/json/parameters.json'

      # The Teensy toolchain is a few hundred megabytes and does not change
      # between runs, so cache it on the contents of platformio.ini.
      - name: Cache the PlatformIO toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build
        working-directory: firmware
        run: pio run -e teensy40

      # firmware/firmware.hex is committed in the repo (previously updated by
      # hand after a local build) so it's always available without needing a
      # toolchain. Keep it in sync with what actually builds from source.
      - name: Copy the built firmware into the repo
        if: success()
        working-directory: firmware
        run: cp .pio/build/teensy40/firmware.hex firmware.hex

      # The job `if:` above stops this specific commit from re-triggering
      # this job.
      - name: Commit the built firmware
        # A pull request from a fork gets a read only token and its branch
        # lives in the fork, so nothing can be pushed there. Skip the commit
        # and let the build result stand on its own.
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update built firmware.hex"
          file_pattern: 'firmware/firmware.hex'

      # Handy for testing a pull request without building it locally.
      - name: Keep the built firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-hex
          path: firmware/.pio/build/teensy40/firmware.hex
          if-no-files-found: warn
